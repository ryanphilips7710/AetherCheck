<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AetherCheck - Live Call</title>
<!-- The real extension files, not a copy. What we demo is what ships. -->
<link rel="stylesheet" href="../extension/content/overlay.css">
<style>
  html, body { margin: 0; height: 100%; background: #202124; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  .meet { display: flex; flex-direction: column; height: 100%; }
  .stage { flex: 1; display: grid; place-items: center; gap: 18px; }
  .tile {
    width: 420px; height: 260px; border-radius: 14px;
    background: linear-gradient(145deg, #3c4043, #2a2c2f);
    display: grid; place-items: center; position: relative;
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
  }
  .avatar {
    width: 92px; height: 92px; border-radius: 50%;
    background: #5f6368; display: grid; place-items: center;
    font-size: 34px; color: #e8eaed; font-weight: 600;
  }
  .name {
    position: absolute; left: 14px; bottom: 12px;
    color: #e8eaed; font-size: 13px; display: flex; align-items: center; gap: 7px;
  }
  .mic { width: 8px; height: 8px; border-radius: 50%; background: #34a853; }
  .bar {
    height: 68px; background: #202124; border-top: 1px solid #3c4043;
    display: flex; align-items: center; justify-content: center; gap: 14px;
  }
  .btn { width: 44px; height: 44px; border-radius: 50%; background: #3c4043; }
  .btn.end { width: 58px; background: #ea4335; }
  .caption {
    position: absolute; bottom: 86px; left: 50%; transform: translateX(-50%);
    max-width: 620px; padding: 10px 16px; border-radius: 8px;
    background: rgba(0,0,0,.75); color: #e8eaed; font-size: 14px; text-align: center;
  }
</style>
</head>
<body>
  <div class="meet">
    <div class="stage">
      <div class="tile">
        <div class="avatar">VS</div>
        <div class="name"><span class="mic"></span> Inspector Vikram Singh (CBI)</div>
      </div>
    </div>
    <div class="bar">
      <div class="btn"></div><div class="btn"></div>
      <div class="btn end"></div>
      <div class="btn"></div><div class="btn"></div>
    </div>
  </div>
  <script src="../extension/content/overlay.js"></script>
</body>
</html>
